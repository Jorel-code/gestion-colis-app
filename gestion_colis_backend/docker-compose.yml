version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: gestion_colis_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: M0tdep@sse
      MYSQL_DATABASE: gestion_colis
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema_gestion_colis.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: .
    container_name: gestion_colis_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: M0tdep@sse
      DB_NAME: gestion_colis
    ports:
      - "5000:5000"

volumes:
  db_data:
